pid /home/admin/.local/state/zigtrackr-nginx.pid;
error_log stderr warn;

events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    client_body_temp_path /home/admin/.local/state/zigtrackr-client-body;
    proxy_temp_path /home/admin/.local/state/zigtrackr-proxy;
    client_max_body_size 30m;

    limit_req_zone $binary_remote_addr zone=zigtrackr_login:10m rate=120r/m;

    map $http_upgrade $zigtrackr_connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 0.0.0.0:1811;
        server_name 192.168.1.128;
        root /home/admin/Bug-Tracker/ZigTrackr-Frontend/dist;
        index index.html;

        location = /api/v1/auth/login/ {
            limit_req zone=zigtrackr_login burst=100 nodelay;
            limit_req_status 429;
            proxy_pass http://127.0.0.1:3299;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:3299;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $zigtrackr_connection_upgrade;
            proxy_read_timeout 300s;
        }

        location /static/ {
            proxy_pass http://127.0.0.1:3299;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /media/ { return 404; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
